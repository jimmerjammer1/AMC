<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Studyflow — Study Log</title>
<meta name="description" content="Run a live study timer or log time manually, and review your full session history." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Crect width=%27100%27 height=%27100%27 fill=%27%23e9eef2%27/%3E%3Crect x=%2712%27 y=%2712%27 width=%2776%27 height=%2776%27 fill=%27none%27 stroke=%27%2316324f%27 stroke-width=%276%27/%3E%3Ctext x=%2750%27 y=%2766%27 font-family=%27Georgia,serif%27 font-style=%27italic%27 font-size=%2748%27 fill=%27%2316324f%27 text-anchor=%27middle%27%3ES%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="shared/styles.css" />
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="shared/store.js"></script>
<script src="shared/nav.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useRef } = React;
const S = window.Store;

function formatTime(totalSeconds) {
  const h = Math.floor(totalSeconds / 3600);
  const m = Math.floor((totalSeconds % 3600) / 60);
  const sec = totalSeconds % 60;
  const pad = (n) => String(n).padStart(2, "0");
  return h > 0 ? `${h}:${pad(m)}:${pad(sec)}` : `${pad(m)}:${pad(sec)}`;
}

// Stopwatch face: 60 ticks around a rim, a sweeping hand for seconds.
const TICKS = Array.from({ length: 60 }, (_, i) => {
  const angle = i * 6;
  const major = i % 5 === 0;
  const outerR = 100;
  const innerR = major ? 84 : 92;
  const rad = ((angle - 90) * Math.PI) / 180;
  return {
    key: i,
    major,
    x1: 110 + outerR * Math.cos(rad),
    y1: 110 + outerR * Math.sin(rad),
    x2: 110 + innerR * Math.cos(rad),
    y2: 110 + innerR * Math.sin(rad),
  };
});

function StopwatchDial({ elapsed, running }) {
  const angle = (elapsed % 60) * 6;
  return (
    <div className={"sf-timer-ring" + (running ? " active" : "")}>
      <svg viewBox="0 0 220 220">
        <circle className="sf-dial-rim" cx="110" cy="110" r="100" />
        {TICKS.map((t) => (
          <line
            key={t.key}
            className={"sf-dial-tick " + (t.major ? "major" : "minor")}
            x1={t.x1} y1={t.y1} x2={t.x2} y2={t.y2}
          />
        ))}
        <line className="sf-dial-hand" x1="110" y1="110" x2="110" y2="36" style={{ transform: `rotate(${angle}deg)` }} />
        <circle className="sf-dial-hub" cx="110" cy="110" r="4" />
      </svg>
      <div className="sf-timer-center">
        <div className="sf-timer-time">{formatTime(elapsed)}</div>
        {running && (
          <div style={{ display: "flex", alignItems: "center", gap: 6, marginTop: 8, fontSize: "0.7rem", color: "var(--text-muted)", fontWeight: 600, textTransform: "uppercase", letterSpacing: "0.06em" }}>
            <span className="sf-pulse-dot"></span>recording
          </div>
        )}
      </div>
    </div>
  );
}

function SubjectPicker({ subjects, value, onChange, onAdd }) {
  const [adding, setAdding] = useState(false);
  const [name, setName] = useState("");
  return (
    <div className="sf-field">
      <label className="sf-label">Subject</label>
      {!adding ? (
        <div style={{ display: "flex", gap: 8 }}>
          <select className="sf-select" value={value} onChange={(e) => onChange(e.target.value)}>
            {subjects.map((s) => (
              <option key={s.id} value={s.id}>{s.name}</option>
            ))}
          </select>
          <button type="button" className="sf-btn ghost" onClick={() => setAdding(true)}>+ New</button>
        </div>
      ) : (
        <div style={{ display: "flex", gap: 8 }}>
          <input className="sf-input" autoFocus placeholder="e.g. Calculus" value={name} onChange={(e) => setName(e.target.value)} />
          <button
            type="button"
            className="sf-btn primary"
            onClick={() => {
              if (!name.trim()) return;
              const s = onAdd(name);
              onChange(s.id);
              setName("");
              setAdding(false);
            }}
          >
            Add
          </button>
          <button type="button" className="sf-btn ghost" onClick={() => setAdding(false)}>Cancel</button>
        </div>
      )}
    </div>
  );
}

function AddExtraTime({ onAdd }) {
  const [customMinutes, setCustomMinutes] = useState("");

  function addCustom() {
    const m = parseFloat(customMinutes);
    if (m > 0) {
      onAdd(m);
      setCustomMinutes("");
    }
  }

  return (
    <div className="sf-field">
      <label className="sf-label">Already put in time? Add it to the clock</label>
      <div style={{ display: "flex", gap: 6, flexWrap: "wrap", alignItems: "center" }}>
        {[5, 15, 30, 60].map((m) => (
          <button
            key={m}
            type="button"
            className="sf-btn ghost"
            style={{ padding: "7px 11px", fontSize: "0.7rem" }}
            onClick={() => onAdd(m)}
          >
            +{m < 60 ? m + "m" : "1h"}
          </button>
        ))}
        <input
          className="sf-input"
          type="number"
          min="1"
          placeholder="Custom min"
          value={customMinutes}
          onChange={(e) => setCustomMinutes(e.target.value)}
          onKeyDown={(e) => { if (e.key === "Enter") { e.preventDefault(); addCustom(); } }}
          style={{ flex: "1 1 100px", minWidth: 90 }}
        />
        <button type="button" className="sf-btn ghost" style={{ padding: "7px 11px", fontSize: "0.7rem" }} onClick={addCustom}>
          Add
        </button>
      </div>
    </div>
  );
}

function TimerCard({ subjects, onSaved }) {
  const [subjectId, setSubjectId] = useState(subjects[0] ? subjects[0].id : "");
  const [note, setNote] = useState("");
  const [running, setRunning] = useState(false);
  const [elapsed, setElapsed] = useState(0);
  const intervalRef = useRef(null);

  useEffect(() => {
    if (!subjectId && subjects[0]) setSubjectId(subjects[0].id);
  }, [subjects]);

  useEffect(() => {
    if (running) {
      intervalRef.current = setInterval(() => setElapsed((e) => e + 1), 1000);
    } else {
      clearInterval(intervalRef.current);
    }
    return () => clearInterval(intervalRef.current);
  }, [running]);

  const addSubject = (name) => window.Store.addSubject(name);
  const addExtraMinutes = (m) => setElapsed((e) => e + Math.round(m * 60));

  function handleStop() {
    setRunning(false);
    const minutes = elapsed / 60;
    if (minutes >= 0.25 && subjectId) {
      window.Store.addSession({ subjectId, minutes, date: window.Store.todayISO(), note });
      onSaved();
    }
    setElapsed(0);
    setNote("");
  }

  return (
    <div className="sf-card hoverable" style={{ padding: 28 }}>
      <h3 style={{ fontSize: "1.05rem", marginBottom: 18 }}>Live session</h3>

      <StopwatchDial elapsed={elapsed} running={running} />

      <div style={{ marginTop: 22 }}>
        <SubjectPicker subjects={subjects} value={subjectId} onChange={setSubjectId} onAdd={addSubject} />
        <div className="sf-field">
          <label className="sf-label">Note (optional)</label>
          <input className="sf-input" placeholder="What are you working on?" value={note} onChange={(e) => setNote(e.target.value)} />
        </div>
        <AddExtraTime onAdd={addExtraMinutes} />
      </div>

      <div style={{ display: "flex", gap: 10 }}>
        {!running ? (
          <button className="sf-btn primary" style={{ flex: 1 }} onClick={() => setRunning(true)} disabled={!subjectId}>▶ Start</button>
        ) : (
          <button className="sf-btn ghost" style={{ flex: 1 }} onClick={() => setRunning(false)}>⏸ Pause</button>
        )}
        <button className="sf-btn danger" style={{ flex: 1 }} onClick={handleStop} disabled={elapsed === 0}>■ Stop & Save</button>
      </div>
    </div>
  );
}

function ManualEntry({ subjects, onSaved }) {
  const [subjectId, setSubjectId] = useState(subjects[0] ? subjects[0].id : "");
  const [hours, setHours] = useState("");
  const [minutes, setMinutes] = useState("");
  const [date, setDate] = useState(window.Store.todayISO());
  const [note, setNote] = useState("");

  useEffect(() => {
    if (!subjectId && subjects[0]) setSubjectId(subjects[0].id);
  }, [subjects]);

  const addSubject = (name) => window.Store.addSubject(name);

  function handleSubmit(e) {
    e.preventDefault();
    const total = (parseFloat(hours) || 0) * 60 + (parseFloat(minutes) || 0);
    if (total <= 0 || !subjectId) return;
    window.Store.addSession({ subjectId, minutes: total, date, note });
    setHours("");
    setMinutes("");
    setNote("");
    onSaved();
  }

  return (
    <form className="sf-card hoverable" style={{ padding: 28 }} onSubmit={handleSubmit}>
      <h3 style={{ fontSize: "1.05rem", marginBottom: 18 }}>Log time manually</h3>
      <SubjectPicker subjects={subjects} value={subjectId} onChange={setSubjectId} onAdd={addSubject} />
      <div style={{ display: "flex", gap: 12 }}>
        <div className="sf-field" style={{ flex: 1 }}>
          <label className="sf-label">Hours</label>
          <input className="sf-input" type="number" min="0" placeholder="0" value={hours} onChange={(e) => setHours(e.target.value)} />
        </div>
        <div className="sf-field" style={{ flex: 1 }}>
          <label className="sf-label">Minutes</label>
          <input className="sf-input" type="number" min="0" max="59" placeholder="0" value={minutes} onChange={(e) => setMinutes(e.target.value)} />
        </div>
      </div>
      <div className="sf-field">
        <label className="sf-label">Date</label>
        <input className="sf-input" type="date" value={date} max={window.Store.todayISO()} onChange={(e) => setDate(e.target.value)} />
      </div>
      <div className="sf-field">
        <label className="sf-label">Note (optional)</label>
        <input className="sf-input" placeholder="What did you cover?" value={note} onChange={(e) => setNote(e.target.value)} />
      </div>
      <button className="sf-btn primary" style={{ width: "100%" }} type="submit">Add Session</button>
    </form>
  );
}

function History({ sessions, subjects, onDelete }) {
  return (
    <div className="sf-card hoverable" style={{ padding: 28, marginTop: 24 }}>
      <h3 style={{ fontSize: "1.05rem", marginBottom: 16 }}>Full history</h3>
      {sessions.length === 0 && (
        <div className="sf-empty">
          <div className="sf-empty-mark"></div>
          <div>No sessions logged yet — start the timer above or add one manually.</div>
        </div>
      )}
      {sessions.map((s) => {
        const subj = subjects.find((x) => x.id === s.subjectId);
        return (
          <div key={s.id} className="sf-ledger-row" style={{ padding: "12px 0", borderBottom: "1px solid var(--rule)" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
              <span className="sf-dot" style={{ background: subj ? subj.color : "var(--text-faint)" }}></span>
              <div>
                <div style={{ fontWeight: 600, fontSize: "0.88rem" }}>{subj ? subj.name : "Deleted subject"}</div>
                <div style={{ fontSize: "0.75rem", color: "var(--text-faint)" }}>{s.date}{s.note ? " · " + s.note : ""}</div>
              </div>
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
              <div className="sf-chip">{window.Store.formatMinutes(s.minutes)}</div>
              <button
                onClick={() => onDelete(s.id)}
                aria-label="Delete session"
                style={{ border: "none", background: "none", cursor: "pointer", color: "var(--text-faint)", fontSize: "1rem", lineHeight: 1 }}
              >
                ✕
              </button>
            </div>
          </div>
        );
      })}
    </div>
  );
}

function LogPage() {
  const [subjects, setSubjects] = useState([]);
  const [sessions, setSessions] = useState([]);

  function refresh() {
    setSubjects(window.Store.getSubjects());
    setSessions(window.Store.getSessions());
  }

  useEffect(refresh, []);

  return (
    <React.Fragment>
      {SFNav("log")}
      <main className="sf-page">
        <span className="sf-eyebrow">Study Log</span>
        <h1 className="sf-title">Track every focused minute.</h1>
        <p className="sf-subtitle">Run a live timer while you work, or backfill a session you already finished.</p>

        <div className="sf-grid cols-2" style={{ marginTop: 30, alignItems: "start" }}>
          <TimerCard subjects={subjects} onSaved={refresh} />
          <ManualEntry subjects={subjects} onSaved={refresh} />
        </div>

        <History sessions={sessions} subjects={subjects} onDelete={(id) => { window.Store.deleteSession(id); refresh(); }} />
        <footer className="sf-foot">Studyflow — private, local, and only for you.</footer>
      </main>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<LogPage />);
</script>
</body>
</html>
